name: IndexedDB Trace

# A diagnostic harness for the macOS-only IndexedDB hang, in which every async
# IDB request stops completing partway through the offline storage tests and
# does not recover until the browser restarts.
#
# This runs the offline/storage tests with --idb-trace, which records the
# sequence and timing of every IDB operation and dumps the trace to the console
# once the database stops responding.  The goal is a trace faithful enough to
# replay as a standalone, Shaka-free reproduction.
#
# Manual trigger only.  Nothing here runs on push, PR, or a schedule, so it
# cannot affect normal CI signal.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref to build and test."
        required: false
      filter:
        description: "Test filter.  'offline' expands to all storage tests."
        required: false
        default: "offline"
      runs:
        description: >
          Times to repeat the suite in each job.  The hang is rare, so
          measuring its rate, or showing that a fix removed it, needs many
          samples.
        required: false
        default: "5"
      test_timeout:
        description: >
          Per-test timeout [ms].  Lower than the 120s default on purpose: once
          the database wedges, every remaining test burns a full timeout in
          beforeEach and another in the body, which drags the run out for no
          added information.  Healthy storage tests take about a second.
        required: false
        default: "30000"

jobs:
  build:
    name: Build Player
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Build Player
        timeout-minutes: 20
        run: python3 build/all.py --only-es5

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: player-build
          path: dist/

  trace:
    needs: build
    strategy:
      matrix:
        include:
          # The three macOS Chromium browsers that exhibit the hang.
          - os: macos-latest
            browser: Chrome
            extra_flags: "--running_in_vm"
          - os: macos-latest
            browser: Edge
            extra_flags: "--running_in_vm"
          - os: macos-latest
            browser: Opera
            extra_flags: "--running_in_vm"

          # Control: same code, same tests, on a platform where storage passes.
          # This gives us a healthy trace to diff a wedged one against.
          - os: ubuntu-latest
            browser: Chrome
            extra_flags: "--use-xvfb --running_in_vm"

      fail-fast: false

    name: ${{ matrix.os }} ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # "Chrome for Testing" shadows real Chrome and lacks basic codecs.
      - name: 'Delete "Chrome for Testing" on Mac'
        timeout-minutes: 5
        if: matrix.os == 'macos-latest' && matrix.browser == 'Chrome'
        run: sudo rm -rf /Applications/Google\ Chrome\ for\ Testing.app

      - name: 'Install Edge on Mac'
        timeout-minutes: 5
        if: matrix.os == 'macos-latest' && matrix.browser == 'Edge'
        run: brew install --cask microsoft-edge

      - name: 'Install Opera on Mac'
        timeout-minutes: 5
        if: matrix.os == 'macos-latest' && matrix.browser == 'Opera'
        run: brew install --cask opera

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: player-build
          path: dist/

      # continue-on-error so that the trace is still uploaded when the tests
      # fail, which is the case we actually care about.
      - name: Trace IndexedDB
        id: trace
        timeout-minutes: 60
        continue-on-error: true
        shell: bash
        # Use test.py --runs rather than looping here.  Actions runs each step
        # under "bash -e", so a shell loop aborts on the first run that fails,
        # which is exactly the run that found a hang -- it would stop sampling
        # at the moment the thing we are counting occurs.  test.py loops
        # internally and records every run's result.
        run: |
          python3 build/test.py \
            --no-build \
            --browsers "${{ matrix.browser }}" \
            --filter "${{ inputs.filter || 'offline' }}" \
            --idb-trace \
            --runs "${{ inputs.runs || 5 }}" \
            --test-timeout "${{ inputs.test_timeout || 30000 }}" \
            --reporters spec \
            ${{ matrix.extra_flags }} \
            2>&1 | tee idb-trace.log

      # The console view truncates long lines and long logs, and the trace is
      # both.  Keep the raw log as an artifact.
      - name: Upload trace log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: idb-trace-${{ matrix.browser }}-${{ matrix.os }}
          path: idb-trace.log
          if-no-files-found: warn
          retention-days: 14

      # Print the sample size and hit count, so the wedge rate can be read off
      # the job without downloading and parsing the trace.
      - name: Report wedge status
        if: always()
        shell: bash
        run: |
          sessions=$(grep -c "idb-trace] Installed" idb-trace.log || true)
          wedges=$(grep -c "WEDGE DETECTED" idb-trace.log || true)
          echo "runs_started=$sessions"
          echo "runs_wedged=$wedges"
          {
            echo "### ${{ matrix.os }} ${{ matrix.browser }}"
            echo ""
            echo "| runs started | runs wedged |"
            echo "| --- | --- |"
            echo "| $sessions | $wedges |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$wedges" -gt 0 ]; then
            echo "::warning::IndexedDB wedged in $wedges of $sessions runs on ${{ matrix.os }} ${{ matrix.browser }}"
            grep -m5 "WEDGE DETECTED" idb-trace.log
          fi
